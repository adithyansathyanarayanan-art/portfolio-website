<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact — Adithyan S.</title>
  <meta name="description" content="Contact details for Adithyan S.: phone, email and social profiles.">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Newsreader:ital,wght@0,400;0,500;0,600;1,400&family=Work+Sans:wght@400;500;600&display=swap"
    rel="stylesheet">

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- Custom cursor dot — purely decorative, hidden on touch devices -->
  <div class="cursor-dot" id="cursorDot" aria-hidden="true"></div>

  <div id="siteContent">

    <!-- Sidebar navigation (same as the other pages) -->
    <aside class="sidebar">
      <a class="wordmark" href="index.html" aria-label="Adithyan S. — home"><img src="assets/images/wordmark.png" alt="" width="360" height="400"></a>
      <nav class="site-nav" aria-label="Primary">
        <a href="index.html#work">Work</a>
        <a href="about.html">About</a>
        <a href="contact.html" aria-current="page">Contact</a>
      </nav>
    </aside>

    <main class="main-content" id="top">

      <h1 class="sr-only">Contact</h1>

      <section class="contact" aria-label="Contact details">

        <!-- Most active: Instagram is the centrepiece, Behance sits to its side -->
        <div class="contact-featured">
          <a class="contact-social contact-social--primary" href="https://www.instagram.com/artus_mushroomus/"
            rel="noopener noreferrer" target="_blank">
            <img class="contact-icon contact-icon--avatar" src="assets/images/instagram-avatar.png" alt="" width="180"
              height="180">
            <span class="contact-social-label">Instagram</span>
            <span class="contact-social-handle">@artus_mushroomus</span>
            <span class="contact-social-note">Most active &middot; quickest reply</span>
          </a>
          <!-- Icon-only links to the right of Instagram: Behance, then LinkedIn -->
          <div class="contact-icon-links">
            <a class="contact-icon-link" href="https://www.behance.net/adithyasathyan" rel="noopener noreferrer"
              target="_blank" aria-label="Behance: adithyasathyan" title="Behance">
              <img src="assets/images/behance.png" alt="" width="32" height="32">
            </a>
            <a class="contact-icon-link" href="https://www.linkedin.com/in/adithyan-sathyanarayanan-072b5b22b"
              rel="noopener noreferrer" target="_blank" aria-label="LinkedIn: Adithyan Sathyanarayanan"
              title="LinkedIn">
              <img src="assets/images/linkedin.png" alt="" width="32" height="32">
            </a>
          </div>
        </div>

        <h2 class="contact-group-title">Direct</h2>
        <dl class="contact-list">
          <div class="contact-row">
            <dt>Phone</dt>
            <dd>+91 94968 03379</dd>
          </div>
          <div class="contact-row">
            <dt>Whatsapp</dt>
            <dd>+971 52 639 1071</dd>
          </div>
          <div class="contact-row">
            <dt>Email</dt>
            <dd><a href="mailto:adithyansathyanarayanan@gmail.com">adithyansathyanarayanan@gmail.com</a></dd>
          </div>
        </dl>
      </section>

    </main>

    <footer class="site-footer">
      <p class="footer-note">&copy; <span id="year"></span> Adithyan Sathyanarayanan</p>
    </footer>

  </div>

  <script>
    document.getElementById('year').textContent = new Date().getFullYear();

    // Custom cursor dot (same behaviour as the other pages)
    const cursorDot = document.getElementById('cursorDot');
    if (cursorDot && window.matchMedia('(hover: hover)').matches) {
      document.addEventListener('mousemove', (e) => {
        cursorDot.style.left = e.clientX + 'px';
        cursorDot.style.top = e.clientY + 'px';
      });
      document.querySelectorAll('a, button').forEach(el => {
        el.addEventListener('mouseenter', () => cursorDot.classList.add('hovering'));
        el.addEventListener('mouseleave', () => cursorDot.classList.remove('hovering'));
      });
    }
  </script>

</body>

</html>
